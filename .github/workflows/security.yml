name: Security

# Sicherheitsprüfungen als fester Teil des Builds (SAST/DAST/SCA).
# Vorgehensweise und Auswertung: docs/code-audit.md
#
#   • codeql    — statische Analyse (Semantik-Ebene, Datenfluss)
#   • semgrep   — regelbasierte Muster (OWASP Top 10, Geheimnisse, Python)
#   • zap       — dynamischer Basisscan gegen die laufende Anwendung
#   • (pip-audit läuft in ci.yml und ist dort ein hartes Tor)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Wöchentlich Montag 06:00 UTC — auch ohne Änderungen laufen lassen,
    # damit neue Erkennungsregeln und CVEs sichtbar werden.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    permissions:
      security-events: write   # Ergebnisse ins Security-Tab schreiben
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: CodeQL initialisieren
        uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          languages: python
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3

      - name: CodeQL analysieren
        uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          category: "/language:python"

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Semgrep (OWASP Top 10, Python, Geheimnisse)
        run: |
          semgrep scan \
            --config p/python \
            --config p/owasp-top-ten \
            --config p/secrets \
            --metrics=off \
            --exclude tests \
            --severity WARNING --severity ERROR \
            --error

  zap-baseline:
    # Dynamischer Basisscan (passiv + wenige aktive Prüfungen) gegen die
    # laufende Anwendung. Ohne Anmeldung: AUTH_ENABLED=0 öffnet alle
    # Seiten, damit der Scan sie auch sieht — die Zugriffskontrolle selbst
    # wird in den Unit-Tests (tests/test_auth_admin.py u. a.) und
    # statisch (CodeQL/Semgrep) geprüft.
    #
    # Bewusst mit `docker run --network host` statt der Action-Vorlage:
    # aus dem ZAP-Container zeigt 127.0.0.1 sonst auf den Container
    # selbst, nicht auf die Anwendung auf dem Runner — der Scan würde
    # das Ziel nie erreichen.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Image bauen
        run: docker build -t adr-rechner:dast .

      - name: Anwendung starten
        run: |
          docker run -d --name adr-dast \
            -p 5050:5050 \
            -e SECRET_KEY=dast-secret-key \
            -e AUTH_ENABLED=0 \
            -e ADR_BOOTSTRAP_ADMIN=0 \
            adr-rechner:dast
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5050/healthz; then
              echo "Healthcheck erfolgreich"
              exit 0
            fi
            sleep 2
          done
          echo "Anwendung nicht erreichbar"
          docker logs adr-dast
          exit 1

      - name: ZAP Basisscan
        run: |
          docker run --rm --network host \
            -v "$PWD:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t http://127.0.0.1:5050 \
              -r zap_report.html \
              -I
          code=$?
          # 0 = ohne Warnungen, 1 = Warnungen (wird ausgewertet, nicht
          # geblockt) — erst ab 2 ist der Scan selbst fehlgeschlagen.
          if [ "$code" -ge 2 ]; then
            echo "ZAP-Scan fehlgeschlagen (Code $code)"
            exit "$code"
          fi
          echo "ZAP-Scan abgeschlossen (Code $code — Warnungen siehe Report)"

      - name: ZAP-Report archivieren
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zap-baseline-report
          path: zap_report.html
          if-no-files-found: ignore
