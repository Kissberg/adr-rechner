name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Python ${{ matrix.python-version }} einrichten
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Unit-Tests
        run: python -m pytest tests/ -v

      - name: Abhängigkeiten auf bekannte Schwachstellen prüfen
        run: |
          pip-audit --requirement requirements.txt --strict --ignore-vuln GHSA-placeholder || true

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Image bauen (Build-Regression prüfen)
        run: docker build -t adr-rechner:ci .

      - name: Container starten und Healthcheck abfragen
        run: |
          docker run -d --name adr-ci \
            -p 5050:5050 \
            -e SECRET_KEY=ci-test-secret \
            -e ADR_ADMIN_PASSWORD=ci-test-password \
            adr-rechner:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5050/healthz; then
              echo "Healthcheck erfolgreich"
              exit 0
            fi
            sleep 2
          done
          echo "Healthcheck fehlgeschlagen"
          docker logs adr-ci
          exit 1
