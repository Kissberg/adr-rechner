version: '3.8'

services:
  adr-rechner:
    image: adr-rechner:latest
    build: .
    container_name: adr-rechner
    restart: unless-stopped
    # Nur auf dem lokalen Host veröffentlichen. Für den produktiven Zugriff
    # einen Reverse-Proxy mit TLS vorschalten und den Port nicht direkt
    # exponieren.
    ports:
      - "127.0.0.1:5050:5050"
    volumes:
      - adr_data:/app/data
      - adr_exports:/app/exports
    environment:
      - TZ=Europe/Berlin
      - FLASK_DEBUG=0
      - AUTH_ENABLED=${AUTH_ENABLED:-1}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY muss gesetzt werden}
      - ADR_ADMIN_USER=${ADR_ADMIN_USER:-admin}
      - ADR_ADMIN_PASSWORD=${ADR_ADMIN_PASSWORD:-}
      # Im Produktivbetrieb auf 1 setzen: Dann startet der Container nicht,
      # wenn ADR_ADMIN_PASSWORD fehlt, statt ein Passwort zu erzeugen.
      - ADR_REQUIRE_ADMIN_PASSWORD=${ADR_REQUIRE_ADMIN_PASSWORD:-0}
      - PREFER_SECURE_COOKIE=${PREFER_SECURE_COOKIE:-1}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-50}
      # Passwortrichtlinie und Schutz gegen Raten
      - ADR_PASSWORD_MIN_LENGTH=${ADR_PASSWORD_MIN_LENGTH:-12}
      - ADR_MAX_LOGIN_ATTEMPTS=${ADR_MAX_LOGIN_ATTEMPTS:-10}
      - ADR_LOGIN_LOCKOUT_MINUTES=${ADR_LOGIN_LOCKOUT_MINUTES:-15}
      # Aufbewahrungsfrist des Audit-Logs in Tagen. Enthält Benutzernamen
      # und ggf. IP-Adressen (Art. 5 Abs. 1 lit. e DSGVO) — Frist im
      # Löschkonzept festlegen, siehe DSGVO.md. 0 = beim Start nicht räumen.
      - ADR_AUDIT_RETENTION_DAYS=${ADR_AUDIT_RETENTION_DAYS:-3650}
      # IP-Adressen im Audit-Log: nur erforderlich, wenn Vorfälle
      # aufgeklärt werden müssen. 0 reduziert den Personenbezug.
      - ADR_AUDIT_LOG_IP=${ADR_AUDIT_LOG_IP:-1}
      # Eigenes Datenverzeichnis je Instanz — für eine Instanz pro
      # Niederlassung auf demselben Server.
      - ADR_DB_DIR=${ADR_DB_DIR:-/app/data}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  adr_data:
  adr_exports:
