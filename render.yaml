# ADR 1000-Punkte-Rechner — Blueprint für eine Instanz bei Render
# ---------------------------------------------------------------------------
# Zweck: die Anwendung über eine öffentliche HTTPS-Adresse bereitstellen —
# vollständige Oberfläche inklusive der Administrationsbereiche
# (Benutzerverwaltung, Einstellungen, ADR-Import), auch für Kollegen, die
# keinen Zugang zum eigenen Netz haben.
#
# Die Anmeldung ist EINGESCHALTET (AUTH_ENABLED=1): beim Aufruf erscheint die
# Anmeldeseite. Auf dem leeren Datenverzeichnis legt die Anwendung beim ersten
# Start den ersten Administrator an — Benutzername `admin`, Passwort `admin`
# (Werkseinstellung aus auth.py, BOOTSTRAP_ADMIN_*), weil ADR_ADMIN_PASSWORD
# hier bewusst NICHT gesetzt wird: ein Passwort im öffentlichen Repository wäre
# ein veröffentlichtes Passwort. Der Wechsel wird bei der ersten Anmeldung
# erzwungen, bis dahin ist keine andere Seite und keine Schnittstelle
# erreichbar.
#
# HINWEIS: Das Konto `admin`/`admin` ist offen, bis es jemand benutzt hat.
# Die Adresse daher unmittelbar nach dem Deployment selbst aufrufen, sich
# anmelden und ein eigenes Passwort setzen. Wer zuerst anmeldet, bestimmt das
# Passwort.
#
# Datenverzeichnis: das Dateisystem der Free-Instanz ist flüchtig (Neustart ~15
# Minuten ohne Zugriff). Bei jedem Neustart entsteht der Erstzugang erneut,
# Testdaten sind weg; die UN-Datenbank baut sich beim Start neu auf.
#
# Diese Angaben stehen an drei Stellen und müssen zusammen gepflegt werden:
# hier, im README (Abschnitt *Testinstanz für Kollegen*) und in der Anleitung
# (Abschnitt 11.5).
#
# dockerCommand überschreibt den Startbefehl des Images: der Port kommt vom
# Hoster ($PORT), und --preload verhindert das Wettrennen zweier Worker um die
# SQLite-Sperre beim ersten Start (siehe CHANGELOG 4.2.2).
services:
  - type: web
    name: adr-rechner-demo
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    autoDeploy: true
    dockerCommand: >-
      gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 2 --preload
      --timeout 120 --access-logfile - --error-logfile - app:app
    envVars:
      - key: TZ
        value: Europe/Berlin
      - key: HOME
        value: /tmp
      # Anmeldepflicht. Ohne diese Zeile gilt ebenfalls 1 (Standard in auth.py);
      # sie steht hier ausdrücklich, damit die Konfiguration lesbar bleibt.
      - key: AUTH_ENABLED
        value: "1"
      # Benutzername des ersten Administrators. Das Passwort bleibt bei der
      # Werkseinstellung `admin` (erzwungener Wechsel bei der ersten Anmeldung).
      - key: ADR_ADMIN_USER
        value: admin
      # Render liefert ausschließlich über HTTPS aus; damit wird das
      # Sitzungscookie nur über eine gesicherte Verbindung übertragen.
      - key: PREFER_SECURE_COOKIE
        value: "1"
      - key: SECRET_KEY
        generateValue: true
